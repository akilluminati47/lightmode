name: Snake Game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: dahan8473/snake-and-commits@v1
        with:
          github_user: akilluminati47
          output: dist/snake.svg
          theme: green

      # The action's themes all use GitHub's dark cell palette, so remap them to
      # the light one. Intensity inverts on purpose: on white, more commits is darker.
      - name: Recolour cells for light mode
        run: |
          sed -i \
            -e 's/#161b22/#ebedf0/gI' \
            -e 's/#0e4429/#9be9a8/gI' \
            -e 's/#006d32/#40c463/gI' \
            -e 's/#26a641/#30a14e/gI' \
            -e 's/#39d353/#216e39/gI' \
            -e 's/#b7ffd0/#1a7f37/gI' \
            -e 's/#8affc1/#116329/gI' \
            -e 's/#7d8590/#57606a/gI' \
            dist/snake.svg
          if grep -qE '#(161b22|0e4429|006d32|26a641|39d353|b7ffd0|8affc1)' dist/snake.svg; then
            echo "dark palette survived the remap"; exit 1
          fi

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
